[workspace]
members = ["mentra", "mentra-provider", "examples"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/oops-rs/mentra"
homepage = "https://github.com/oops-rs/mentra"

[workspace.dependencies]
glob-match = "0.2"
jiff = { version = "0.2.46", default-features = false, features = ["std"] }
