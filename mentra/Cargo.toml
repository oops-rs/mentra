[package]
name = "mentra"
version = "0.25.0"
edition.workspace = true
rust-version.workspace = true
description = "An agent runtime for tool-using LLM applications"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mentra"
readme = "README.md"
keywords = ["agents", "llm", "runtime", "tools", "ai"]
categories = ["asynchronous", "development-tools"]

[features]
# Default-on so an existing dependant sees no change: every caller who linked
# mentra before this feature existed had the Responses websocket transport, and
# an upgrade should not quietly take a transport away. Forwarded rather than
# left to mentra-provider's own default (which is why the dependency below sets
# `default-features = false`) so a host that only ever streams over HTTP+SSE can
# turn it off here and drop tokio-tungstenite from its tree.
default = ["responses-websocket", "store-sqlite"]
responses-websocket = ["mentra-provider/responses-websocket"]
# Default-on for the same reason as the websocket transport: every caller who
# linked mentra before this feature existed had the SQLite store, and an
# upgrade must not quietly swap their persistence backend. Turning it off
# drops rusqlite (and its bundled SQLite) from the tree; the builder's
# default persistent store is then the file-backed one.
store-sqlite = ["dep:rusqlite", "dep:windows-sys"]
openai-oauth = ["dep:ring"]
test-utils = []

[dependencies]
mentra-provider = { version = "0.7.0", path = "../mentra-provider", default-features = false }
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12.23", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
url = "2.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
async-trait = "0.1.89"
futures-util = "0.3.31"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
base64 = "0.22.1"
serde_yaml_ng = "0.10"
directories = "6.0.0"
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
thiserror = "2.0.18"
# Advisory OS file locks for the file store's agent leases: flock/LockFileEx
# released automatically when the holding process dies, which is exactly the
# lifetime a resume lease wants.
fs2 = "0.4"
strum = { version = "0.27", features = ["derive"] }
libc = "0.2"
regex = "1.12.2"
rand = "0.9.2"
ring = { version = "0.17.14", optional = true }
glob-match = { workspace = true }
# Gitignore matching for the workspace search walk. `ignore` also ships a
# directory walker, which is deliberately unused: the walk here reauthorizes
# every entry against the agent's read roots, and a third-party walker cannot.
ignore = "0.4.23"
similar = "2.7.0"
unicode-normalization = "0.1.24"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
# Tests only: `start_paused` lets a retry schedule measured in tens of seconds
# be asserted without waiting them out. Not enabled for the library build, so
# nothing a dependant links changes.
tokio = { version = "1.50.0", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"], optional = true }

[[bench]]
name = "long_session"
harness = false
required-features = ["test-utils", "store-sqlite"]
