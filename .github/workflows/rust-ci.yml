name: Rust CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Check workspace against the MSRV
        run: cargo check --workspace --all-targets --all-features

  rust-ci:
    name: Format, Lint, and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  no-default-features:
    name: Default features off
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # `responses-websocket` is default-on and exists so a host that only
      # streams over HTTP+SSE can turn it off and drop tokio-tungstenite from
      # its tree. Nothing verified that configuration still builds, so the
      # feature could stop serving its one purpose without failing anything.
      # A compile check is the right cost here: the realistic breakage is a
      # `#[cfg]` that stops lining up, not a behavioral difference.
      - name: Check with default features off
        run: cargo check --workspace --all-targets --no-default-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # A broken intra-doc link is invisible to every other job here: it is not
      # a compile error and not a lint. Without this, published documentation
      # can point at items that do not exist, or at private ones a reader
      # cannot see, and nothing says so.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
