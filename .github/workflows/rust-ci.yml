name: Rust CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust (1.88)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Check workspace against the MSRV
        run: cargo check --workspace --all-targets --all-features

  rust-ci:
    name: Format, Lint, and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  no-default-features:
    name: Default features off
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # `responses-websocket` and `store-sqlite` are default-on and exist so
      # a host can turn them off — dropping tokio-tungstenite, or rusqlite
      # and its bundled SQLite. With the features off the crate does not just
      # build differently, it behaves differently: the builder's default
      # persistent store becomes the file-backed one, and the
      # store-parameterized suites run against it. Tests, not a compile
      # check, are what keep that configuration honest. `-p mentra` rather
      # than `--workspace`: the examples crate turns the defaults back on,
      # and feature unification would quietly re-enable them everywhere.
      - name: Test with default features off
        run: cargo test -p mentra --no-default-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # A broken intra-doc link is invisible to every other job here: it is not
      # a compile error and not a lint. Without this, published documentation
      # can point at items that do not exist, or at private ones a reader
      # cannot see, and nothing says so.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
